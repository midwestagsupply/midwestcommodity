# Put today's corn bid on the page, or take it off.
#
# Reads the JSON the `emmertadmin` repository commits from Bids' board and
# renders it into index.html. Needs no secrets: `bids` is a public
# repository, so this is a plain unauthenticated read, and the commit back
# into this repository uses the built-in GITHUB_TOKEN.
#
# Nothing here scrapes anything. If the reader has stopped, this takes the
# price off the page rather than leaving yesterday's number up.
#
# AND SINCE 2026-09-18 IT ALSO STARTS THE READER, which is the more important
# of the two things it does.
#
# GitHub drops scheduled fires per repository, not per account. Measured over
# the 845 ten-minute slots from 2026-09-12 17:58Z to 2026-09-18 14:54Z, off the
# commits each repository makes on essentially every run:
#
#     midwestagsupply/emmertadmin       186 slots   22.0%
#     midwestagsupply/badgergrain       479 slots   56.7%
#     midwestagsupply/midwestcommodity  479 slots   56.7%
#
# Same organisation, same account, the same six fires an hour, the same week,
# and this repository was served two and a half times better than the one that
# reads the board. Inside the trading day the difference is worse still:
# emmertadmin held a read in 17 of the 179 slots between 8am and 3pm Central on
# a weekday. 9.5%.
#
# So the schedule this repository is GIVEN is worth more than the page it
# renders, and the first step of the job spends it on starting emmertadmin's
# reader. See "Start the reader" below, and the loop it is carefully not.

name: Prices

on:
  schedule:
    # Times are UTC. GitHub's scheduler is best effort and runs late under
    # load; nothing here depends on landing on the minute. Every entry dodges
    # :00, which is when every cron on the platform fires at once and a job
    # asking for it waits behind all of them.
    #
    # ONE SCHEDULE, EVERY TEN MINUTES, ALL DAY, EVERY DAY.
    #
    # This replaced three windows: ten-minutely 12:00-21:59 on weekdays, half
    # hourly off hours, half hourly at the weekend. The windows existed because
    # the feed behind them was not uniform -- bids polled hourly off hours and
    # three-hourly at the weekend, so building more often than that bought
    # nothing but a rerun of the same file. bids now polls every ten minutes
    # around the clock, so the reason the windows were narrow is gone, and a
    # window that has outlived its reason is just a gap.
    #
    # THE MINUTES ARE CHOSEN AGAINST THE SCRAPER'S, NOT PICKED.
    #
    # bids writes at :03/:13/:23/:33/:43/:53. Reading at :07 lands four minutes
    # after a fresh write. Reading a few minutes BEFORE that write instead of
    # after it costs a full cycle of freshness for nothing, and that is what
    # the old off-hours minutes did: they ran at :17 and :47 while bids wrote
    # at :25, so the :17 read landed eight minutes early and every off-hours
    # build served a file the better part of an hour old.
    #
    # What this buys the hours box, which is the other thing this job renders:
    # it flips to "Closed for the day" at closing time and can only be as
    # current as the last build. At ten minutes the page can say OPEN for at
    # most ten minutes after the gate shuts. It was thirty-five.
    #
    # GitHub honours a fraction of what is asked here -- 66 of 380 requested
    # fires measured across the bids repository, 17.4%. That is why this is the
    # fallback and the dispatch below is the mechanism.
    - cron: "7,17,27,37,47,57 * * * *"

    # AND A SECOND SET OF MINUTES THROUGH THE TRADING DAY ONLY, 2026-09-18.
    #
    # Sig asked for the tightest cadence between 8am and 3pm Central on a
    # weekday. This is the repository to ask it of: it converts an asked fire
    # into a run 52% of the time and emmertadmin manages 22%, so an extra ask
    # placed here is worth more than twice one placed there.
    #
    # WHAT IS AND IS NOT KNOWN ABOUT THAT. The landings are spread evenly
    # across the six minutes already asked for -- 47 to 63 landings each, out
    # of 141 asks each, over the measured week -- so there is no sign of a
    # per-hour cap being shared out among minutes, which is what would make
    # extra minutes worthless. That is consistent with extra asks producing
    # extra runs and it is NOT a measurement of it. The marginal delivery of
    # these six minutes is unmeasured and lies somewhere between nothing and
    # 52%. It is one line and deleting it costs nothing.
    #
    # WHAT IT IS NOT: it is not a longer job. dnilgis/bids lost two thirds of
    # its coverage on 2026-08-27 by holding one runner for fifty minutes of
    # every sixty, which looks to Actions like a persistent server. A run of
    # this file takes about forty seconds and this changes nothing about that.
    #
    # ── THE UTC HOURS, COMPUTED ON BOTH SIDES OF THE CLOCK CHANGE ──────────
    #
    # Cron is UTC and has no idea what Central is. Central is UTC-5 from the
    # second Sunday in March to the first Sunday in November and UTC-6 the rest
    # of the year -- in 2026, 8 March and 1 November. 8am to 3pm Central is
    # therefore 13:00-20:00 UTC in summer and 14:00-21:00 UTC in winter, and no
    # single set of UTC hours is exactly right all year.
    #
    # Hours 13-20 are the UNION, so the window is always covered and one hour
    # is always spent outside it. Fire times were computed, not read by eye:
    #
    #     Fri 2026-10-30  (CDT)  first 08:02 Central   last 15:52 Central
    #     Mon 2026-11-02  (CST)  first 07:02 Central   last 14:52 Central
    #     Thu 2026-03-05  (CST)  first 07:02 Central   last 14:52 Central
    #     Mon 2026-03-09  (CDT)  first 08:02 Central   last 15:52 Central
    #
    # In summer the spare hour falls after the close, in winter before the
    # open, and 8:00 to 15:00 Central is inside every one of them. Across the
    # two changeover weeks, 240 fires, 210 inside the window, 0 at a weekend.
    #
    # THE ALTERNATIVE WAS A STEP THAT CHECKS TZ=America/Chicago AND EXITS.
    # Rejected: a fire that arrives and exits has already spent the fire, and
    # the fires are the scarce thing here. An hour of extra asks a day is the
    # cheaper mistake than a step that throws away a landed run.
    #
    # DAY-OF-WEEK IS 1-5 AND THAT IS CORRECT FOR GITHUB, which numbers Sunday
    # 0. It is not correct for every scheduler -- Cloudflare's field is 1-7 and
    # rejects 0 -- so if these minutes are ever copied anywhere else, check the
    # numbering there rather than assuming it matches. Between 13:00 and 20:59
    # UTC the Central date is the same calendar day as the UTC date in both
    # offsets, so there is no day to wrap and 1-5 really is Monday to Friday
    # in Central. That was computed too.
    #
    # Minutes at :02 and every ten, five clear of the :07 set above, so the two
    # crons interleave to an ask every five minutes rather than doubling up on
    # the same minute.
    - cron: "2,12,22,32,42,52 13-20 * * 1-5"
  # THE FEED TELLS US, INSTEAD OF US ASKING SIX TIMES AN HOUR AND HOPING.
  #
  # emmertadmin fires this the moment Bids' price actually moves, so the
  # page rebuilds inside a minute instead of inside a cron GitHub is not
  # obliged to honour. Measured on 2026-08-20, when the reader was still
  # dnilgis/bids: that repository commits on every run, so its commits are an
  # exact run count, and it recorded ONE run in the 13:00 UTC hour and TWO in
  # the 14:00 hour against six asked. At 10:45 Central the feed had moved at
  # 10:25 and this page still said "as of 9:49am". Nothing was broken; the job
  # had not run. The delivery rate is the platform's, not that repository's, so
  # the measurement carries over.
  #
  # AND IT IS OPTIONAL AT THE SENDING END. emmertadmin nudges only if a
  # SITE_DISPATCH_TOKEN secret is set there; without it the schedule above is
  # the whole mechanism and the price is at most ten minutes behind. A missing
  # token must never be the reason a price is late.
  #
  # THE SCHEDULE ABOVE IS A SAFETY NET, NOT THE MECHANISM. It catches a price
  # that moved while the token was expired, and it is what runs at all if the
  # dispatch is ever removed. Trading a working fallback for a tidier file is
  # not a trade worth making, which is why it was widened to cover the clock
  # rather than deleted once the dispatch proved itself.
  #
  # The payload carries which source moved and its pricedAt, so the run log
  # says why it ran rather than just that it did.
  repository_dispatch:
    types: [price-moved]

  workflow_dispatch:                  # the Run workflow button
  push:
    branches: [main]                  # so a spread change goes live at once

# The commit this job makes does not retrigger it: GitHub deliberately does
# not fire workflows from commits made with the built-in GITHUB_TOKEN.

permissions:
  contents: write

concurrency:
  # Two runs writing index.html at once is how a half-rendered page gets
  # committed. Later run wins; the earlier one is not cancelled mid-push.
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    # A hung run holds the `prices` concurrency group, and hours.yml shares it,
    # so every later run of both workflows queues behind it. The default is six
    # hours. Six hours of silence looks exactly like the 2026-08-20 failure,
    # where the box sat closed all morning with a green tick on every run.
    timeout-minutes: 5
    steps:
      # ══════════════════════════════════════════════════════════════════
      #  START THE READER. FIRST STEP, BEFORE THE CHECKOUT, ON PURPOSE.
      # ══════════════════════════════════════════════════════════════════
      #
      # It needs no checkout, no node and no tests, so it happens before any of
      # them can fail. A broken build in THIS repository must not be the reason
      # the board went unread for four hours, because the board is what the
      # other repository's four-hour withdrawal clock is measured against.
      #
      # ── THE LOOP THIS IS NOT ────────────────────────────────────────────
      #
      # `github.event_name == 'schedule'` is load-bearing and is not a tidiness
      # check. emmertadmin dispatches `price-moved` back here when the price
      # moves, which starts this workflow with event_name repository_dispatch.
      # If that run also poked the reader, then: poke -> read -> price-moved ->
      # poke -> read, with no upper bound, in three repositories at once, until
      # somebody noticed. That is also precisely the persistent-runner shape
      # that cost dnilgis/bids two thirds of its coverage on 2026-08-27.
      #
      # So the poke happens only on the two events a HUMAN or a CLOCK starts:
      # the schedule, and the Run workflow button. A dispatch never pokes back.
      # test/mirror.test.mjs in emmertadmin fails if this condition is widened.
      #
      # ── TWO DOORS, BECAUSE A TOKEN SCOPE IS NOT A TOKEN ─────────────────
      #
      # workflow_dispatch needs a fine-grained token with Actions: read and
      # write on midwestagsupply/emmertadmin. repository_dispatch needs
      # Contents: read and write. There is no way from here to know which the
      # owner granted, and the failure looks identical -- 403 or 404 -- so it
      # tries the first and falls through to the second. Sig asked for a second
      # way to arrive at the same value; at this layer this is it.
      #
      # ── AND IT IS OPTIONAL, LIKE EVERY OTHER TOKEN IN THESE REPOSITORIES ─
      #
      # No ADMIN_DISPATCH_TOKEN and it says so and carries on. emmertadmin
      # keeps its own cron and its own watchdog, so a missing secret makes the
      # price slower, never wrong, and never stops this page rendering.
      #
      # To enable: Settings -> Secrets and variables -> Actions -> New
      # repository secret, named ADMIN_DISPATCH_TOKEN, a fine-grained token on
      # midwestagsupply/emmertadmin with EITHER Actions: read and write OR
      # Contents: read and write, plus Metadata: read.
      - name: Start the reader
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TOK: ${{ secrets.ADMIN_DISPATCH_TOKEN }}
        # A BLOCK SCALAR. See the note on the step below for the seventeen
        # hours that taught this repository why.
        run: |
          if [ -z "${TOK:-}" ]; then
            echo "no ADMIN_DISPATCH_TOKEN here, so emmertadmin is running on its own"
            echo "schedule alone. That schedule delivered 22.0% of its asked fires over"
            echo "the six days to 2026-09-18. Nothing is broken and nothing is wrong on"
            echo "the page; the price is simply as fresh as that schedule manages."
            exit 0
          fi
          API="https://api.github.com/repos/midwestagsupply/emmertadmin"
          AUTH="Authorization: Bearer $TOK"
          ACC="Accept: application/vnd.github+json"
          VER="X-GitHub-Api-Version: 2022-11-28"
          # Content-Type SAID OUT LOUD. Both bodies below are JSON, and curl's
          # -d announces form encoding unless told otherwise. The API is
          # entitled to answer 415 to that, and a 415 here would read as a
          # token problem and send somebody to regenerate a token that was
          # fine. One header is cheaper than that afternoon.
          CT="Content-Type: application/json"
          # --max-time on both, because curl has no deadline of its own and a
          # hung api.github.com would otherwise sit here until the step ceiling.
          one=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "$AUTH" -H "$ACC" -H "$VER" -H "$CT" \
            "$API/actions/workflows/read.yml/dispatches" \
            -d '{"ref":"main"}') || one=000
          echo "  workflow_dispatch  -> HTTP $one"
          if [ "$one" = "204" ]; then exit 0; fi
          BODY=$(printf '{"event_type":"read-now","client_payload":{"from":"%s"}}' "$GITHUB_REPOSITORY")
          two=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "$AUTH" -H "$ACC" -H "$VER" -H "$CT" \
            "$API/dispatches" -d "$BODY") || two=000
          echo "  repository_dispatch -> HTTP $two"
          if [ "$two" = "204" ]; then exit 0; fi
          echo "::warning::could not start the reader (HTTP $one then $two). Its own"
          echo "cron and its watchdog still run, so this is late prices and not wrong"
          echo "ones. 404 or 403 from both doors means the token lacks Actions write"
          echo "and Contents write on emmertadmin, or has lapsed."

      # WHY THIS RUN HAPPENED, when it was the feed that asked for it.
      #
      # THE PAYLOAD GOES THROUGH env AND NOT INTO THE SCRIPT. A
      # repository_dispatch body is attacker-controlled in the general case, and
      # `run: echo "${{ github.event.client_payload.x }}"` substitutes it into
      # the shell before bash ever sees it -- a payload carrying a quote and a
      # semicolon would run as a command, with this job's contents:write token.
      # Only a token holder can fire this one, but the safe form costs nothing
      # and the unsafe form is the one people copy.
      - name: Why this run happened
        if: github.event_name == 'repository_dispatch'
        env:
          FROM: ${{ github.event.client_payload.from }}
          SOURCE: ${{ github.event.client_payload.source }}
          REASON: ${{ github.event.client_payload.reason }}
          PRICED_AT: ${{ github.event.client_payload.pricedAt }}
          THEIR_RUN: ${{ github.event.client_payload.run }}
        # A BLOCK SCALAR, and not because it is prettier.
        #
        # This line shipped on 2026-08-20 as `run: echo "... $FROM: $SOURCE ..."`
        # and broke every run in both repositories for seventeen hours. The
        # quotes there are the SHELL'S. YAML only treats a quote as a quote when
        # it is the first character of the scalar, and this scalar starts with
        # `echo`, so to YAML the quotes are ordinary text and the `: ` inside
        # `$FROM: $SOURCE` opens a nested mapping. The file stopped parsing, so
        # the workflow never started -- a red run with no steps in it, on the
        # schedule, on push, and on the dispatch this step was added to explain.
        #
        # `run: |` hands the rest to the shell verbatim and YAML stops reading.
        run: |
          # WHY THIS RUN HAPPENED IS NOT ALWAYS "THE PRICE MOVED".
          #
          # The reader's stamp is the time of the last CHECK, not the last
          # move, so emmertadmin now also dispatches after a pass where
          # nothing moved, when this page's stamp has gone stale. Older
          # payloads carry no reason; those are moves.
          case "${REASON:-moved}" in
            checked) WHY="nothing moved, this page's stamp had gone stale" ;;
            cold)    WHY="no reading had landed in a while" ;;
            moved)   WHY="the price moved" ;;
            *)       WHY="reason $REASON" ;;
          esac
          echo "dispatched by $FROM: $SOURCE, $WHY, pricedAt $PRICED_AT (their run $THEIR_RUN)"

      # CHECK OUT THE BRANCH TIP, NOT THE SHA THIS RUN WAS QUEUED AT.
      #
      # Measured on midwestcommodity, 2026-09-10:
      #   20:47:36  a2e0c12 pushed, "3:47pm"
      #   20:56:34  68ea3f6 pushed, "3:56pm", parent a2e0c12
      #   20:56:44  THIS run checks out a2e0c12 -- already ten seconds stale
      #   20:56:53  its push is rejected, "fetch first", job exits 1
      #
      # Both runs were in `concurrency: prices`, so they did NOT run at once.
      # The queue is what did it. `github.sha` is fixed when a run is CREATED,
      # and bare `actions/checkout` fetches that exact SHA:
      #
      #   fetch --depth=1 origin +a2e0c125...:refs/remotes/origin/main
      #
      # So a run that waits in the concurrency queue starts from whatever HEAD
      # was when it was queued, regenerates the page on top of a commit that is
      # no longer the tip, and cannot push. The guard against collision is what
      # creates the staleness. Nothing is corrupted -- the push is refused, not
      # merged -- but the run goes red and its work is thrown away.
      #
      # `ref` takes the branch instead, so a queued run starts from the tip it
      # actually has to build on. The prices are regenerated from the feed on
      # every run, so starting from a newer commit costs nothing.
      #
      # This matters more than it did: the schedule went from half-hourly off
      # hours to ten-minutely around the clock on 2026-09-11, which is more
      # runs, which is more queueing, which is more of exactly this.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # A guard that has stopped working must not be able to publish. The
      # tests need no dependencies and take a second.
      # THE DRIFT GUARD ON THE TWO STATUTORY NOTICES HAD NEVER RUN.
      # tools/check-notices.mjs exists to catch the two sites' ATCP 99.14(2)(a)
      # and 99.26(2)(a) text drifting apart -- they are in separate repos and
      # one can be edited without the other. It was referenced by no workflow
      # and no test: a working guard nothing invoked. It is cheap and it is
      # about the only text on the page that is there by law.
      - name: Statutory notices
        run: node tools/check-notices.mjs

      - name: Test the guards
        run: node --test test/*.test.mjs

      - name: Read the feed and render the panel
        run: node tools/update-prices.mjs

      # The hours box is rebuilt here too, not only by the nightly job.
      #
      # It said "Open today, Monday" on a Tuesday for a week, because the
      # only thing that updates it sat at a path GitHub ignores and had
      # never run. Its own protection -- remove the box rather than let it
      # go stale -- assumes the job runs at all, and a job that has never
      # started cannot remove anything.
      #
      # Running it here as well means the box is corrected within the hour
      # of midnight instead of depending on one cron landing. It is allowed
      # to fail without taking the price down with it: a wrong day is bad,
      # a missing price is worse, and the nightly job reports the same
      # failure where it is not competing with anything.
      - name: Update the hours box too
        continue-on-error: true
        run: node tools/update-today.mjs

      # LASTMOD IS THE ONLY REASON A ONE-PAGE SITE HAS A SITEMAP, and it had
      # read 2026-08-17 for twenty days while this job rewrote the page several
      # times a day. tools/update-sitemap.mjs was written to keep it honest and
      # was wired into nothing. It hashes the page with the timestamp and the
      # hours box stripped out, so a price change moves lastmod and a clock
      # tick does not -- which only became true with the regex fix in the same
      # kit as this step. Allowed to fail: a stale lastmod is a bad day for
      # crawling, a missing price is a bad day for the elevator.
      - name: Date the sitemap
        continue-on-error: true
        run: node tools/update-sitemap.mjs

      - name: Commit if it changed
        run: |
          git config user.name  "prices"
          git config user.email "actions@github.com"
          # price-history.json IS WRITTEN ON EVERY RUN AND WAS NEVER NAMED HERE.
          # tools/update-prices.mjs wrote it into the runner's working tree, this
          # line did not stage it, and the runner was then destroyed. The copy in
          # the repository sat at the hand-made backfill of 2026-08-31 while the
          # page's change line went on reading it -- so on 8 September the board
          # said "down 11c from Monday" and meant Monday 31 August. Nothing was
          # red; the run was green and the prices were right.
          # test/staged.test.mjs now fails if this list and the updater's writes
          # ever disagree again, which is the actual rule.
          git add index.html bids.json bids.csv hours.json sitemap.xml price-history.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "prices: $(TZ=America/Chicago date '+%-d %B %-I:%M%P')"
            git push
          fi
